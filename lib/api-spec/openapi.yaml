openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: King SMM Panel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication
  - name: services
    description: SMM services catalog
  - name: orders
    description: Order management
  - name: wallet
    description: Wallet and balance
  - name: dashboard
    description: Dashboard statistics
  - name: admin
    description: Admin-only operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all SMM services
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /services/{id}:
    get:
      operationId: getService
      tags: [services]
      summary: Get a service by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Not found

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List user orders with optional filter
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPage"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Insufficient balance or invalid input

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get user wallet/balance
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/topup:
    post:
      operationId: topupWallet
      tags: [wallet]
      summary: Request a wallet top-up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupInput"
      responses:
        "201":
          description: Top-up request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupRequest"

  /wallet/topups:
    get:
      operationId: listTopups
      tags: [wallet]
      summary: List user top-up requests
      responses:
        "200":
          description: List of top-up requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopupRequest"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard statistics
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users with balances
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden

  /admin/users/{id}/balance:
    patch:
      operationId: updateUserBalance
      tags: [admin]
      summary: Manually set a user's wallet balance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustInput"
      responses:
        "200":
          description: Balance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "403":
          description: Forbidden

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders across all users (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated all orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrdersPage"
        "403":
          description: Forbidden

  /admin/orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [admin]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupStatusInput"
      responses:
        "200":
          description: Order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "403":
          description: Forbidden

  /admin/topups:
    get:
      operationId: listAdminTopups
      tags: [admin]
      summary: List all top-up requests (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated topup requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopupsPage"
        "403":
          description: Forbidden

  /admin/topups/{id}:
    patch:
      operationId: updateTopupStatus
      tags: [admin]
      summary: Approve or reject a top-up request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopupStatusInput"
      responses:
        "200":
          description: Topup status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopup"
        "403":
          description: Forbidden

  /admin/settings:
    get:
      operationId: getPaymentSettings
      tags: [admin]
      summary: Get payment settings (UPI ID, QR URL)
      responses:
        "200":
          description: Payment settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
    put:
      operationId: updatePaymentSettings
      tags: [admin]
      summary: Update payment settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
        "403":
          description: Forbidden

  /admin/api-settings:
    get:
      operationId: getApiSettings
      tags: [admin]
      summary: Get external SMM API connection settings
      responses:
        "200":
          description: API settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSettings"
    put:
      operationId: updateApiSettings
      tags: [admin]
      summary: Update external SMM API connection settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiSettings"
      responses:
        "200":
          description: API settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSettings"
        "403":
          description: Forbidden

  /admin/services:
    get:
      operationId: listAdminServices
      tags: [admin]
      summary: List all services (including inactive) for admin
      responses:
        "200":
          description: List of all services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [admin]
      summary: Add a new SMM service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "403":
          description: Forbidden

  /admin/services/{id}:
    patch:
      operationId: updateService
      tags: [admin]
      summary: Update an SMM service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "403":
          description: Forbidden
    delete:
      operationId: deleteService
      tags: [admin]
      summary: Delete (deactivate) a service
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
        "403":
          description: Forbidden

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /services/categories:
    get:
      operationId: listCategories
      tags: [services]
      summary: List all service categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - firstName
        - lastName
        - profileImageUrl
        - createdAt

    Service:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        description:
          type: string
        pricePerThousand:
          type: number
        minQuantity:
          type: integer
        maxQuantity:
          type: integer
        platform:
          type: string
        isActive:
          type: boolean
      required:
        - id
        - name
        - category
        - description
        - pricePerThousand
        - minQuantity
        - maxQuantity
        - platform
        - isActive
        - platform

    Order:
      type: object
      properties:
        id:
          type: integer
        serviceId:
          type: integer
        serviceName:
          type: string
        platform:
          type: string
        link:
          type: string
        quantity:
          type: integer
        charge:
          type: number
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - serviceId
        - serviceName
        - platform
        - link
        - quantity
        - charge
        - status
        - createdAt

    OrdersPage:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - orders
        - total
        - page
        - totalPages

    OrderInput:
      type: object
      properties:
        serviceId:
          type: integer
        link:
          type: string
        quantity:
          type: integer
      required:
        - serviceId
        - link
        - quantity

    Wallet:
      type: object
      properties:
        balance:
          type: number
        totalSpent:
          type: number
        totalAdded:
          type: number
      required:
        - balance
        - totalSpent
        - totalAdded

    TopupInput:
      type: object
      properties:
        amount:
          type: number
        paymentMethod:
          type: string
        transactionId:
          type: string
      required:
        - amount
        - paymentMethod
        - transactionId

    TopupRequest:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        paymentMethod:
          type: string
        transactionId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - paymentMethod
        - transactionId
        - status
        - createdAt

    DashboardStats:
      type: object
      properties:
        balance:
          type: number
        totalOrders:
          type: integer
        completedOrders:
          type: integer
        pendingOrders:
          type: integer
        totalSpent:
          type: number
        recentOrders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required:
        - balance
        - totalOrders
        - completedOrders
        - pendingOrders
        - totalSpent
        - recentOrders

    AdminStats:
      type: object
      properties:
        totalUsers:
          type: integer
        totalBalance:
          type: number
        totalOrders:
          type: integer
        pendingTopups:
          type: integer
      required:
        - totalUsers
        - totalBalance
        - totalOrders
        - pendingTopups

    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        balance:
          type: number
        totalOrders:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - balance
        - totalOrders
        - createdAt

    AdminOrder:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        userEmail:
          type: ["string", "null"]
        serviceId:
          type: integer
        serviceName:
          type: string
        platform:
          type: string
        link:
          type: string
        quantity:
          type: integer
        charge:
          type: number
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - serviceId
        - serviceName
        - platform
        - link
        - quantity
        - charge
        - status
        - createdAt

    AdminOrdersPage:
      type: object
      properties:
        orders:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - orders
        - total
        - page
        - totalPages

    AdminTopup:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        userEmail:
          type: ["string", "null"]
        amount:
          type: number
        paymentMethod:
          type: string
        transactionId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - amount
        - paymentMethod
        - transactionId
        - status
        - createdAt

    AdminTopupsPage:
      type: object
      properties:
        topups:
          type: array
          items:
            $ref: "#/components/schemas/AdminTopup"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required:
        - topups
        - total
        - page
        - totalPages

    BalanceAdjustInput:
      type: object
      properties:
        balance:
          type: number
      required:
        - balance

    TopupStatusInput:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PaymentSettings:
      type: object
      properties:
        upiId:
          type: string
        qrUrl:
          type: string
      required:
        - upiId
        - qrUrl

    ApiSettings:
      type: object
      properties:
        apiUrl:
          type: string
        apiKey:
          type: string
        isEnabled:
          type: boolean
      required:
        - apiUrl
        - apiKey
        - isEnabled

    ServiceInput:
      type: object
      properties:
        apiServiceId:
          type: string
        name:
          type: string
        category:
          type: string
        platform:
          type: string
        description:
          type: string
        pricePerThousand:
          type: number
        minQuantity:
          type: integer
        maxQuantity:
          type: integer
      required:
        - apiServiceId
        - name
        - category
        - platform
        - description
        - pricePerThousand
        - minQuantity
        - maxQuantity
